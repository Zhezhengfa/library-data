<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书馆数据看板</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 56px; }
    .section-title { border-left: 4px solid #0d6efd; padding-left: 10px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#home">图书馆数据看板</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#books">图书查询</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats">借阅统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">图书馆三维</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <section id="home" class="mb-5">
      <h2 class="section-title h4 mb-3">首页 · 馆藏概览</h2>
      <div class="row g-3">
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">馆藏图书</h3>
              <p class="card-text fs-3 text-primary" id="stat-total">—</p>
              <p class="card-text small text-muted">册</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">今日借阅</h3>
              <p class="card-text fs-3 text-success" id="stat-borrow">—</p>
              <p class="card-text small text-muted">人次</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">在馆人数</h3>
              <p class="card-text fs-3 text-warning" id="stat-visitors">—</p>
              <p class="card-text small text-muted">人（模拟）</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-3">
          <div class="card text-center">
            <div class="card-body">
              <h3 class="h5 card-title">三维导览</h3>
              <p class="card-text fs-3 text-info">3D</p>
              <p class="card-text small text-muted">
                <a href="three-d/scene.html" class="text-decoration-none">进入 →</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section id="books" class="mb-5">
      <h2 class="section-title h4 mb-3">图书查询</h2>
      <div class="alert alert-secondary">
        <section id="books" class="mb-5">
          <h2 class="section-title h4 mb-3">图书查询</h2>
          <div class="row g-2 mb-3">
            <div class="col-md-3">
              <label class="form-label small">按类别</label>
              <select class="form-select form-select-sm" id="filter-category">
                <option value="">全部类别</option>
              </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">借阅状态</label>
                <select class="form-select form-select-sm" id="filter-status">
                    <option value="">全部</option>
                    <option value="available">可借</option>
                    <option value="borrowed">借出中</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">关键词</label>
                <input type="text" class="form-control form-control-sm" id="filter-keyword" placeholder="书名/作者">
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button class="btn btn-outline-secondary btn-sm w-100" id="btn-reset">重置筛选</button>
            </div>
          </div>
          <p class="text-muted small" id="book-count">共 0 册</p>
          <div class="row g-3" id="book-list"></div>
        </section>
      </div>
    </section>
    <section id="stats" class="mb-5">
      <h2 class="section-title h4 mb-3">借阅统计</h2>
      <div class="alert alert-secondary">
        <section id="stats" class="mb-5">
          <h2 class="section-title h4 mb-3">借阅统计</h2>
          <p id="status" class="alert alert-warning" style="display:none"></p>
          <p class="text-muted" id="sub-title">数据来源：图书馆模拟数据集</p>
          <div class="row g-3">
            <div class="col-lg-6">
              <h3 class="h6">各品类月度借阅量（ECharts 柱状图）</h3>
              <div id="bar-chart" style="height:360px"></div>
            </div>
            <div class="col-lg-6">
              <h3 class="h6">月度借阅总量趋势（ECharts 折线图）</h3>
              <div id="line-chart" style="height:360px"></div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
  <footer class="bg-light py-3 text-center text-muted small">
    图书馆数据看板 · 自主实践任务
  </footer>
    <script src="libs/jquery-3.7.1.min.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
    <script src="libs/echarts.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
