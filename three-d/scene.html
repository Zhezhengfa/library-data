<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书馆三维导览</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87ceeb; }
    #back {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      padding: 8px 16px; background: rgba(13,110,253,.85); color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    #back:hover { background: rgba(13,110,253,1); }
    #tip {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.5); color: #fff; padding: 6px 14px;
      border-radius: 20px; font-size: 12px; z-index: 10;
    }
  </style>
</head>
<body>
  <button id="back" onclick="location.href='../index.html'">← 返回首页</button>
  <div id="tip">鼠标拖拽旋转 · 滚轮缩放 · 右键平移</div>
  <script src="../libs/three.min.js"></script>
  <script src="../libs/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 25, 70);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(14, 11, 16);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(15, 20, 10);
    sun.castShadow = true;
    scene.add(sun);
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 70),
      new THREE.MeshStandardMaterial({ color: 0x9ccc65 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const lib = new THREE.Mesh(
      new THREE.BoxGeometry(14, 9, 8),
      new THREE.MeshStandardMaterial({ color: 0xfff8e1 })
    );
    lib.position.set(0, 4.5, 0);
    lib.castShadow = true;
    lib.receiveShadow = true;
    scene.add(lib);
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(10.5, 3, 4),
      new THREE.MeshStandardMaterial({ color: 0x5d4037 })
    );
    roof.position.set(0, 10.5, 0);
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    scene.add(roof);
    const steps = new THREE.Mesh(
      new THREE.BoxGeometry(6, 0.5, 3),
      new THREE.MeshStandardMaterial({ color: 0xbdbdbd })
    );
    steps.position.set(0, 0.25, 5);
    scene.add(steps);
    const makeColumn = (x) => {
      const col = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.4, 7, 16),
        new THREE.MeshStandardMaterial({ color: 0xf5f5f5 })
      );
      col.position.set(x, 3.5, 4.2);
      col.castShadow = true;
      scene.add(col);
    };
    makeColumn(-2.2);
    makeColumn(2.2);
    const winMat = new THREE.MeshStandardMaterial({ color: 0x42a5f5 });
    [-4, -2, 2, 4].forEach(x => {
      [2, 5, 7.5].forEach(y => {
        const win = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.1), winMat);
        win.position.set(x, y, 4.05);
        scene.add(win);
      });
    });
    const bookSculpt = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.3, 2),
      new THREE.MeshStandardMaterial({ color: 0x6d4c41 })
    );
    bookSculpt.position.set(0, 1, 7.5);
    bookSculpt.rotation.x = -0.3;
    bookSculpt.castShadow = true;
    scene.add(bookSculpt);
    const pedestal = new THREE.Mesh(
      new THREE.BoxGeometry(2, 1, 2),
      new THREE.MeshStandardMaterial({ color: 0x9e9e9e })
    );
    pedestal.position.set(0, 0.5, 7.5);
    scene.add(pedestal);
    const makeTree = (x, z) => {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.25, 2, 8),
        new THREE.MeshStandardMaterial({ color: 0x6d4c41 })
      );
      trunk.position.set(x, 1, z);
      scene.add(trunk);
      const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1.3, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x2e7d32 })
      );
      leaves.position.set(x, 2.7, z);
      leaves.castShadow = true;
      scene.add(leaves);
    };
    makeTree(-10, 3);
    makeTree(10, 3);
    makeTree(-10, -4);
    makeTree(10, -4);
    makeTree(-6, 9);
    makeTree(6, 9);
    const pool = new THREE.Mesh(
      new THREE.CircleGeometry(3, 32),
      new THREE.MeshStandardMaterial({ color: 0x29b6f6 })
    );
    pool.rotation.x = -Math.PI / 2;
    pool.position.set(0, 0.03, 11);
    scene.add(pool);
    const animate = () => {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    };
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
